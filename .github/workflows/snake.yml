name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#CA3500&color_dots=#EFE9E1,#F6C9A8,#EE9A63,#EE601A,#CA3500
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6900&color_dots=#161616,#5A2A10,#9A3F12,#D9520F,#FF6900

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
